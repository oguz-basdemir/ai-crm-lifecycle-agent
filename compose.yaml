services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CRM_DATABASE_PATH: /app/data/crm.db
      CRM_RULES_PATH: /app/config/rules.json
    volumes:
      - crm-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  dashboard:
    build: .
    command: ["python", "-m", "streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      CRM_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
volumes:
  crm-data:

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-crm-lifecycle-agent"
version = "1.0.0"
description = "Synthetic CRM lifecycle, explainable lead scoring, and approval-gated marketing automation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "starlette>=0.46,<1", "uvicorn>=0.30,<1", "streamlit>=1.41,<2",
  "pandas>=2.2,<4", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "playwright>=1.49,<2"]

[tool.setuptools.packages.find]
include = ["crm_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
